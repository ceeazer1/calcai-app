# This file lives at the root of the independent calcai-app repository.
definitions:
  scripts:
    - &verify
      name: Verify release source
      script: |
        set -euo pipefail
        flutter pub get --enforce-lockfile
        python3 tool/release_preflight.py
        flutter analyze --no-pub --fatal-infos
        flutter test --no-pub
    - &sdk
      name: Verify App Store SDK
      script: |
        set -euo pipefail
        xcodebuild -version
        SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
        if [ "${SDK_VERSION%%.*}" -lt 26 ]; then
          echo "App Store uploads require the iOS 26 SDK or newer."
          exit 1
        fi

workflows:
  ios-check:
    name: CalcAI iOS validation
    working_directory: .
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.2
      xcode: latest
    triggering:
      events: [push, pull_request]
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - *verify
      - *sdk
      - name: Compile the production iOS app
        script: flutter build ios --release --no-codesign --no-pub --target lib/main.dart
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: CalcAI TestFlight candidate (manual)
    working_directory: .
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CalcAI
    environment:
      flutter: 3.44.2
      xcode: latest
      groups: [app_store_credentials]
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.calcai.calcaiApp
    # Run manually after the release checklist is complete. Validation builds
    # do not upload, and this workflow never submits to public App Review.
    scripts:
      - *verify
      - *sdk
      - name: Use configured signing identities
        script: |
          set -euo pipefail
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed candidate
        script: |
          set -euo pipefail
          : "${APP_STORE_APP_ID:?Set the numeric App Store app ID in app_store_credentials}"
          : "${PROJECT_BUILD_NUMBER:?Codemagic project build counter is required}"
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" --platform IOS --all-versions)
          # Empty output after a successful lookup means there is no build yet.
          LATEST_BUILD=${LATEST_BUILD:-0}
          if ! [[ "$LATEST_BUILD" =~ ^[0-9]+$ ]]; then
            echo "Latest Apple build is not an integer; review the version strategy."
            exit 1
          fi
          BUILD_NUM=$((LATEST_BUILD + 1))
          COUNTER_BUILD=$((1000 + PROJECT_BUILD_NUMBER))
          if [ "$COUNTER_BUILD" -gt "$BUILD_NUM" ]; then BUILD_NUM=$COUNTER_BUILD; fi
          flutter build ipa --release --no-pub --target lib/main.dart \
            --build-number="$BUILD_NUM" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Check archived app privacy manifest
        script: |
          set -euo pipefail
          APP=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          test -f "$APP/PrivacyInfo.xcprivacy"
          plutil -lint "$APP/PrivacyInfo.xcprivacy" "$APP/Info.plist"
          codesign --verify --deep --strict "$APP"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
