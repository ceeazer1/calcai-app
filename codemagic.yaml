workflows:
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    
    integrations:
      app_store_connect: CalcAI

    # Build on every push to main. This lived only in the Codemagic UI
    # before, so nothing in the repo said when a build runs; keeping it
    # here means the trigger is reviewable and travels with the branch.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    
    environment:
      flutter: stable
      xcode: latest
      groups:
        - app_store_credentials

    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
      
      - name: Create certificate and profiles
        script: |
          set -e  # fail fast on any error
          
          # Verify env var exists
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY not set!"
            echo "Add it in Codemagic > Environment variables > group: app_store_credentials"
            exit 1
          fi
          
          echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          echo "Key written ($(wc -c < /tmp/cert_key.pem) bytes)"
          
          # Revoke ALL existing distribution certs so only ours remains
          echo "Revoking any existing distribution certificates..."
          app-store-connect certificates list \
            --type IOS_DISTRIBUTION \
            --save || true
          
          # Create fresh certificate with our persistent key
          echo "Creating distribution certificate..."
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key @file:/tmp/cert_key.pem \
            --save || echo "Certificate may already exist for this key"
          
          # Force-create provisioning profile
          echo "Fetching/creating provisioning profile..."
          app-store-connect fetch-signing-files "com.calcai.calcaiApp" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
          
          echo "Signing setup complete"
      
      - name: Set up keychain and profiles
        script: |
          keychain add-certificates
          xcode-project use-profiles
      
      - name: Get packages
        script: |
          flutter packages pub get
      
      - name: Build iOS
        script: |
          xcode-project use-profiles
          # App Store Connect refuses a build number it has already
          # accepted, and pubspec's is static -- so every upload after
          # the first collided on 92 and the publish step failed.
          #
          # Not the commit count: Codemagic clones shallow, so it read
          # 50 here against 143 locally, and 50 is below what has
          # already been uploaded. Codemagic's own counter increments
          # per build and does not depend on how much history was
          # fetched; the offset clears the versions already on Apple.
          # Falls back to minutes-since-epoch, which only ever grows,
          # if that variable is ever missing.
          if [ -n "$BUILD_NUMBER" ]; then
            BUILD_NUM=$(( 1000 + BUILD_NUMBER ))
          else
            BUILD_NUM=$(( $(date +%s) / 60 ))
          fi
          echo "Building as build number $BUILD_NUM"
          flutter build ipa \
            --release \
            --build-number="$BUILD_NUM" \
            --export-options-plist=/Users/builder/export_options.plist
    
    artifacts:
      - build/ios/ipa/*.ipa
    
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
