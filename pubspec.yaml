name: calcai_app
description: CalcAI companion app for device setup, Wi-Fi, notes, and history.
publish_to: 'none'
version: 1.0.0+149

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Flutter's iOS text-editing controls use these glyphs internally.
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.35.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  sign_in_with_apple: ^8.1.0
  google_sign_in: ^6.2.2
  crypto: ^3.0.6
  package_info_plus: ^8.0.0
  # Full-screen photo viewer: save the calculator photo to the camera roll and
  # hand it to the system share sheet.
  gal: ^2.3.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  cupertino_http: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# App icon generation. Put your 1024x1024 logo at the image_path below, then
# run:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  android: false
  remove_alpha_ios: true        # iOS icons must be opaque (no transparency)
  background_color_ios: "#FFFFFF"  # fill behind a transparent logo — change to taste
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#09090B"
    theme_color: "#09090B"

flutter:
  uses-material-design: true

  # The logo, shown on the sign-in screen, the boot screen and in Settings.
  # Same file flutter_launcher_icons builds the app icon from.
  assets:
    - assets/icon/app_icon.png
    - assets/icon/calcai_wordmark.png
    - assets/fonts/
